name: Image Compression Tests

on:
  push:
    paths:
      - "projects/image_compression/**"
      - ".github/workflows/image-compression-tests.yml"

  pull_request:
    paths:
      - "projects/image_compression/**"
      - ".github/workflows/image-compression-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    defaults:
      run:
        working-directory: projects/image_compression

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest
